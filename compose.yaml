services:
  bookseerr:
    image: ghcr.io/teamcogs/bookseerr:${BOOKSEERR_IMAGE_TAG:-latest}
    pull_policy: missing
    build:
      context: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 5057
      BOOKSEERR_DATA_DIR: /data
      BOOKSEERR_ADMIN_PASSWORD: ${BOOKSEERR_ADMIN_PASSWORD:?Generate a private admin password in .env}
      BOOKSEERR_SESSION_SECRET: ${BOOKSEERR_SESSION_SECRET:?Generate a private encryption key in .env}
    ports:
      - '${BOOKSEERR_BIND_ADDRESS:-0.0.0.0}:${BOOKSEERR_PORT:-5057}:5057'
    volumes:
      - bookseerr_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  bookseerr_data:
    name: ${BOOKSEERR_DATA_VOLUME:-bookseerr_data}
