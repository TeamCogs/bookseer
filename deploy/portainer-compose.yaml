# Portainer: add a stack on a standalone Docker endpoint.
# Supply the two required private values in the stack's environment form.
services:
  bookseerr:
    image: ghcr.io/teamcogs/bookseerr:${BOOKSEERR_IMAGE_TAG:-latest}
    init: true
    restart: unless-stopped
    environment:
      BOOKSEERR_ADMIN_USERNAME: ${BOOKSEERR_ADMIN_USERNAME:-admin}
      BOOKSEERR_ADMIN_PASSWORD: ${BOOKSEERR_ADMIN_PASSWORD:?Set a private admin password}
      BOOKSEERR_SESSION_SECRET: ${BOOKSEERR_SESSION_SECRET:?Set a private encryption key}
      BOOKSEERR_PUBLIC_URL: ${BOOKSEERR_PUBLIC_URL:-}
      BOOKSEERR_SECURE_COOKIES: ${BOOKSEERR_SECURE_COOKIES:-false}
    ports:
      - '${BOOKSEERR_PORT:-5057}:5057'
    volumes:
      - bookseerr_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 45s
volumes:
  bookseerr_data:
    name: ${BOOKSEERR_DATA_VOLUME:-bookseerr_data}
