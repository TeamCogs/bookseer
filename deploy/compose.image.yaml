# Optional override to check for a newer public image on every startup.
# docker compose -f compose.yaml -f deploy/compose.image.yaml pull
# docker compose -f compose.yaml -f deploy/compose.image.yaml up -d --no-build
services:
  bookseer:
    image: ghcr.io/teamcogs/bookseer:${BOOKSEER_IMAGE_TAG:-latest}
    pull_policy: always
