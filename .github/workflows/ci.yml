name: Verify Bookseerr
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Check the restricted review source
        run: python3 -m unittest discover -s deploy/review -p 'test_*.py'
      - name: Validate the isolated review stack
        run: node deploy/review/check-compose.mjs
  container:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: docker build -t bookseerr:test .
      - name: Create isolated credentials
        run: |
          TEST_PASSWORD=$(openssl rand -hex 24)
          TEST_KEY=$(openssl rand -hex 32)
          echo "::add-mask::$TEST_PASSWORD"
          echo "::add-mask::$TEST_KEY"
          echo "BOOKSEERR_ADMIN_PASSWORD=$TEST_PASSWORD" >> "$GITHUB_ENV"
          echo "BOOKSEERR_SESSION_SECRET=$TEST_KEY" >> "$GITHUB_ENV"
      - name: Run hardened container
        run: |
          docker volume create bookseerr-test
          docker run -d --name bookseerr --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:rw,noexec,nosuid,size=64m -p 127.0.0.1:5057:5057 -v bookseerr-test:/data -e BOOKSEERR_ADMIN_PASSWORD -e BOOKSEERR_SESSION_SECRET bookseerr:test
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:5057/api/health && exit 0; sleep 2; done
          docker logs bookseerr
          exit 1
      - run: node scripts/docker-smoke.mjs
      - name: Verify persistence after restart
        run: |
          docker restart bookseerr
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:5057/api/health && break; sleep 2; done
          node scripts/docker-smoke.mjs
          test "$(docker exec bookseerr id -u)" != 0
      - name: Container diagnostics
        if: failure()
        run: docker logs bookseerr
